<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Nabdh AI</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<header class="navbar">
  <div class="logo">🎬 Nabdh<span>AI</span></div>
  <a href="index.html" class="btn btn-ghost">العودة للرئيسية</a>
</header>

<section class="auth-wrap">
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin">تسجيل الدخول</button>
      <button class="tab-btn" id="tabSignup">حساب جديد</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="loginForm" class="auth-form">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="example@email.com" required>

      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>

      <p class="error-msg" id="loginError"></p>

      <button type="submit" class="btn btn-primary full">دخول</button>
    </form>

    <!-- نموذج إنشاء حساب -->
    <form id="signupForm" class="auth-form hidden">
      <label>الاسم</label>
      <input type="text" id="signupName" placeholder="اسمك الكامل" required>

      <label>البريد الإلكتروني</label>
      <input type="email" id="signupEmail" placeholder="example@email.com" required>

      <label>كلمة المرور</label>
      <input type="password" id="signupPassword" placeholder="••••••••" required>

      <p class="error-msg" id="signupError"></p>

      <button type="submit" class="btn btn-primary full">إنشاء الحساب</button>
    </form>
  </div>
</section>

<script src="assets/js/auth.js"></script>
</body>
</html>
